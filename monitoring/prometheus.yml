global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'devops-student-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:8080', 'host.docker.internal:8080']
        labels:
          environment: 'production'
          app: 'devops-lab'
          tier: 'backend'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Blue Deployment (Current Production v1.0)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment-blue
  labels:
    app: student-management
    version: v1.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-management
      version: v1.0
  template:
    metadata:
      labels:
        app: student-management
        version: v1.0
    spec:
      containers:
      - name: student-app
        image: harshj00/devops-lab:1.0
        ports:
        - containerPort: 8080
---
# Green Deployment (Candidate Release v2.0)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment-green
  labels:
    app: student-management
    version: v2.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-management
      version: v2.0
  template:
    metadata:
      labels:
        app: student-management
        version: v2.0
    spec:
      containers:
      - name: student-app
        image: harshj00/devops-lab:2.0
        ports:
        - containerPort: 8080
---
# Active Production Service routing traffic to Blue (Switch selector to version: v2.0 for Green)
apiVersion: v1
kind: Service
metadata:
  name: active-production-service
spec:
  type: NodePort
  selector:
    app: student-management
    version: v1.0 # Change to v2.0 for instant zero-downtime cutover
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30090
